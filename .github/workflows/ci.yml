name: CI

# Build and type checks only. These never touch marktplaats.nl, so they are
# safe to run on every push. The live checks live in live-check.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow only reads the tree; it never writes to the
# repo. Forks opening pull requests get a read-only token.
permissions:
  contents: read

jobs:
  build:
    name: Build on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
