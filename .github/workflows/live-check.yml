name: Live site check

# This server reads an internal API on a consumer site, so it breaks when that
# site changes rather than when this code changes. This job is the early
# warning: it runs the full suite against the live site on a schedule and opens
# nothing, it just fails loudly so a maintainer notices.
#
# It runs weekly, not per push, because every run sends real traffic to
# marktplaats.nl. Keep it that way.

on:
  schedule:
    # Mondays at 06:17 UTC. Off the hour on purpose.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Verify against marktplaats.nl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Client checks against the live site
        run: npm run test:client

      - name: MCP protocol checks
        run: npm run test:mcp
