version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev tooling bumps rather than three.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
