name: Bug report
description: Something in this code is wrong, independent of the site.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a tool started failing or returning odd data, use **A tool stopped working** instead.
        That template collects what we need to tell a site change from a code bug.

  - type: textarea
    id: what
    attributes:
      label: What is wrong
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "output of node --version"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, or a commit sha"
    validations:
      required: true
